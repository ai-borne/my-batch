name: deploy-staging
# Every non-main branch push deploys to the staging Firebase project via the
# shared deploy pipeline. main is NOT deployed here — it has its own workflow.

on:
  push:
    branches:
      - '**'
      - '!main'
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging:
    name: Deploy staging (my-batch-staging)
    environment: staging
    uses: ./.github/workflows/deploy-website.yml
    with:
      app_env: staging
      project_id: my-batch-staging
    secrets:
      service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
      firebase_api_key: ${{ secrets.FIREBASE_STAGING_API_KEY }}
      firebase_auth_domain: ${{ secrets.FIREBASE_STAGING_AUTH_DOMAIN }}
      firebase_storage_bucket: ${{ secrets.FIREBASE_STAGING_STORAGE_BUCKET }}
      firebase_messaging_sender_id: ${{ secrets.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
      firebase_app_id: ${{ secrets.FIREBASE_STAGING_APP_ID }}
      recaptcha_site_key: ${{ secrets.FIREBASE_STAGING_RECAPTCHA_SITE_KEY }}