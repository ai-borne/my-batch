name: deploy-staging
# Every non-main branch push deploys to the staging Firebase project.
# Production has its own workflow and GitHub Environment gate.

on:
  push:
    branches:
      - '**'
      - '!main'
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging:
    name: Deploy staging (my-batch-staging)
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend deps
        run: npm ci
      - name: Install functions deps
        run: npm ci --prefix functions
      - name: Build functions
        run: npm --prefix functions run build
      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_STAGING_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_STAGING_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: my-batch-staging
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STAGING_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_STAGING_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.FIREBASE_STAGING_RECAPTCHA_SITE_KEY }}
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.27.0
        with:
          args: deploy --only hosting,functions,firestore:rules,firestore:indexes --project my-batch-staging --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}