name: deploy-production
# Runs only on main. Production deploys go through the shared pipeline and are
# scoped to the 'production' GitHub Environment so you can attach protection
# rules (required reviewers, branch checks) in Settings -> Environments.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Deploy production (my-batch-0001)
    environment: production
    uses: ./.github/workflows/deploy-website.yml
    with:
      app_env: production
      project_id: my-batch-0001
    secrets:
      service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
      firebase_api_key: ${{ secrets.FIREBASE_PRODUCTION_API_KEY }}
      firebase_auth_domain: ${{ secrets.FIREBASE_PRODUCTION_AUTH_DOMAIN }}
      firebase_storage_bucket: ${{ secrets.FIREBASE_PRODUCTION_STORAGE_BUCKET }}
      firebase_messaging_sender_id: ${{ secrets.FIREBASE_PRODUCTION_MESSAGING_SENDER_ID }}
      firebase_app_id: ${{ secrets.FIREBASE_PRODUCTION_APP_ID }}
      recaptcha_site_key: ${{ secrets.FIREBASE_PRODUCTION_RECAPTCHA_SITE_KEY }}