name: deploy-production
# Runs only on main. Scoped to the 'production' GitHub Environment so deploys
# wait for the required-reviewer approval configured there.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Deploy production (my-batch-0001)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend deps
        run: npm ci
      - name: Install functions deps
        run: npm ci --prefix functions
      - name: Build functions
        run: npm --prefix functions run build
      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_PRODUCTION_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PRODUCTION_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: my-batch-0001
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PRODUCTION_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_PRODUCTION_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_PRODUCTION_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.FIREBASE_PRODUCTION_RECAPTCHA_SITE_KEY }}
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.27.0
        with:
          args: deploy --only hosting,functions,firestore:rules,firestore:indexes --project my-batch-0001 --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}