name: deploy-website

on:
  workflow_call:
    inputs:
      app_env:
        required: true
        type: string
      project_id:
        required: true
        type: string
    secrets:
      service_account:
        required: true
      firebase_api_key:
        required: true
      firebase_auth_domain:
        required: true
      firebase_storage_bucket:
        required: true
      firebase_messaging_sender_id:
        required: true
      firebase_app_id:
        required: true
      recaptcha_site_key:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app_env }} (${{ inputs.project_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend deps
        run: npm ci
      - name: Install functions deps
        run: npm ci --prefix functions
      - name: Build functions
        run: npm --prefix functions run build
      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: ${{ inputs.app_env }}
          VITE_FIREBASE_API_KEY: ${{ secrets.firebase_api_key }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.firebase_auth_domain }}
          VITE_FIREBASE_PROJECT_ID: ${{ inputs.project_id }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.firebase_storage_bucket }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.firebase_messaging_sender_id }}
          VITE_FIREBASE_APP_ID: ${{ secrets.firebase_app_id }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.recaptcha_site_key }}
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.27.0
        with:
          args: deploy --only hosting,functions,firestore:rules,firestore:indexes --project ${{ inputs.project_id }} --force
        env:
          GCP_SA_KEY: ${{ secrets.service_account }}